name: Build APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          # Cria o arquivo de licença do Android SDK automaticamente
          for package in android-sdk-license android-sdk-preview-license; do
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/${package}
          done

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pacote-apk
          path: bin/*.apk

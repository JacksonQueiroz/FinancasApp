name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Dependências do Android e do Kivy
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          # Ferramenta 'ant' (que estava dando erro de rede) instalada via apt, evitando download externo
          sudo apt-get install -y ant

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Instalando o Buildozer em modo de desenvolvimento (mais atualizado)
          pip install git+https://github.com/kivy/buildozer.git
          pip install cython virtualenv

      - name: Accept Android Licenses (Truque para não travar)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK
        run: |
          # Roda o buildozer (o -v mostra os detalhes)
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-financas
          path: bin/*.apk

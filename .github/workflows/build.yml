name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev ant

      - name: Install Android SDK Tools and accept licenses
        run: |
          # Baixa as ferramentas de linha de comando do Android
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd ~/.buildozer/android/platform/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          # Exporta o PATH para o sdkmanager ser encontrado
          export PATH=$PATH:~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin

          # Aceita as licenças via sdkmanager (o 'yes' responde 'y' automaticamente)
          yes | sdkmanager --licenses || true
          
          # Instala o build-tools (Aidl) e a plataforma que o app precisa
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer.git
          pip install cython virtualenv

      - name: Build APK
        run: |
          # O -v mostra o que está acontecendo em tempo real
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-financas
          path: bin/*.apk
